gemba_mqm_prompt: |
  소스 세그먼트와 트리플 백틱으로 둘러싸인 기계 번역을 기반으로 번역에서 오류 유형을 식별하고 분류합니다. 오류의 범주는 정확도(추가, 오역, 생략, 번역되지 않은 텍스트), 유창성(문자 인코딩, 문법, 불일치, 구두점, 레지스터, 철자), 스타일(어색함), 용어(맥락에 부적절함, 일관성 없음), 비번역, 기타 또는 오류 없음입니다.
  critical 오류는 텍스트의 이해를 저해합니다. major 오류는 흐름을 방해하지만, 텍스트가 말하고자 하는 바는 여전히 이해할 수 있습니다. minor 오류는 기술적으로는 오류이지만, 흐름을 방해하거나 이해를 방해하지는 않습니다.

  MQM 오류 정의
  정확성.
  - 추가: 소스에 없는 콘텐츠를 포함하는 대상 콘텐츠에서 오류가 발생했습니다.
  - 누락: 소스에 있는 콘텐츠가 대상에서 누락된 오류입니다.
  - 잘못된 이름: 대상 텍스트가 원본 텍스트보다 더 구체적이거나 덜 구체적입니다
  - 오역
    - 일반적: 번역은 출처를 정확하게 나타내지 않습니다. 대상 언어에서 잘못된 번역. 예를 들어, 잘못된 단어가 대상 언어에 사용됨; 거짓 친구의 오역(원어와 대상 언어에서 유사한 형태를 가지지만 다른 의미를 가진 단어 또는 표현);
    - 지나치게 직설적: 관용구, 문장, 구조의 직역;
    - 시간적 효과: 철자, 의미론, 형태론과 같은 역사적 언어 요소들이 번역의 정확성에 영향을 미칩니다.
  - 번역되지 않음: 번역을 위해 의도된 텍스트 세그먼트가 대상 콘텐츠에서 누락될 때 발생하는 오류입니다.

  유창성
  - 구두점/맞춤법: 구두점이 누락되었거나 잘못된 방식으로 사용된 경우/단어 철자와 관련된 문제( 대문자로 표시된 단어와 위험으로 사용된 경우 포함)
  검열된 욕설.)
  - 문법: 텍스트의 문법이나 구문과 관련된 문제. 철자법과 철자법 이외의 문제(특히 시제와 조건의 불일치)
  - 불일치: 텍스트에 내부 불일치가 표시됩니다
  - 일관성: 텍스트는 의미적으로 명확하고 논리적이며 일관성이 없기 때문에 독자가 이해할 수 없습니다. 예를 들어, - 불명확한 참조: 상대 대명사 또는 기타 참조 메커니즘은 참조가 불분명합니다.

  스타일.
  - 어색함: 대상 텍스트에서 소스 텍스트 스타일을 부적절하게 유지하기 때문에 과도한 단어나 지나치게 내포된 절이 포함된 스타일입니다.
  - 레지스터: 사양이나 일반 언어 규칙에서 요구하는 것보다 높거나 낮은 형식을 사용하는 텍스트의 특성.
  - 일관성 없음: 텍스트 내에서 스타일이 일관성이 없습니다
  - 문법적이지만 부자연스러운 유니디매틱 스타일.

  용어.
  - 오역: 장르별 또는 문화별 용어가 잘못 번역되었습니다.

  example 1
  Q:
  영어 원문: So we attach this by pressing Ctrl+J.
  참고 번역: Ctrl+J를 눌러서 이것을 연결합니다.
  한국어 번역: 그래서 Ctrl+J를 눌러서 이걸 붙여주는 거죠.
  주어진 출처와 참고 자료를 바탕으로 이 번역에서 critical 오류, major 오류 및 minor 오류를 식별하십시오.

  A:
  critical:
  없음
  major:
  오역 - '붙여주는'(attaching) vs. '연결'(connecting)
  minor:
  어조 - "거죠"는 더 적절한 "합니다"보다 너무 비격식적임

  Q: 위의 오류 정보를 바탕으로, 오직 숫자 세 개만 다음 형식으로 출력하세요: "x, x, x"
  오류 순서는 critical, major, minor입니다. 다른 정보는 쓰지 마세요!

  A: 0, 1, 1

  example 2
  Q:
  영어 원문: But, you'll notice something changed when we Actually, let's use this.
  참고 번역: 뭔가가 바뀐 것을 알 수 있습니다. 다른 것을 사용합시다.
  한국어 번역: 하지만, 실제로 이걸 사용할 때 뭔가 변화가 생긴다는 걸 알게 될 거예요.
  주어진 출처와 참고 자료를 바탕으로 이 번역에서 critical 오류, major 오류 및 minor 오류를 식별하십시오.

  A:
  critical:
  오역 - 번역이 "바뀌었음을 알아차림"을 전달하지 못하고 "변화가 생긴다"고 함
  major:
  없음
  minor:
  어조 - "알게 될 거예요"는 더 적절한 "알 수 있습니다"보다 비격식적임
  스타일 - "실제로 이걸 사용할 때"는 문맥상 어색함

  Q: 위의 오류 정보를 바탕으로, 오직 숫자 세 개만 다음 형식으로 출력하세요: "x, x, x"
  오류 순서는 critical, major, minor입니다. 다른 정보는 쓰지 마세요!

  A: 1, 0, 2

  example 3
  Q:
  영어 원문: When I press Ctrl+J, something different happens, right?
  참고 번역: 제가 Ctrl+J를 누르면, 다른 일이 발생합니다.
  한국어 번역: 제가 Ctrl+J를 누르면 뭔가 다르게 일어난다는 거죠, 맞나요?
  주어진 출처와 참고 자료를 바탕으로 이 번역에서 critical 오류, major 오류 및 minor 오류를 식별하십시오.

  A:
  critical:
  오역 - "뭔가 다르게 일어난다는 거죠"는 "something different happens"를 정확히 전달하지 못함
  major:
  없음
  minor:
  어조 - "거죠, 맞나요?"는 "발생합니다."보다 비격식적임

  Q: 위의 오류 정보를 바탕으로, 오직 숫자 세 개만 다음 형식으로 출력하세요: "x, x, x"
  오류 순서는 critical, major, minor입니다. 다른 정보는 쓰지 마세요!
  
  A: 1, 0, 1
  
